[project]
name = "falcon"
version = "2.0.0"
description = "Field Acoustic, Lens & Climate Observation Node"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "cryptography>=45,<47",
  "uvicorn[standard]>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "av==18.0.0",
  "httpx>=0.28,<1",
  "numpy<2",
  "pillow>=11,<13",
  "psutil>=6,<8",
  "torch==2.8.0",
  "torchvision==0.23.0",
  "torchaudio==2.8.0",
  "pytorchwildlife==1.3.0",
  "open-clip-torch==3.3.0",
  "opencv-python-headless>=4.10,<5",
  "setuptools<81",
  "soundfile>=0.13,<1",
  "librosa==0.11.0",
  "python-multipart>=0.0.20,<1",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-psutil"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }
torchaudio = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
