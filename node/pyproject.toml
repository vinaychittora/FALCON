# The sensor node runs on the system Python of Raspberry Pi OS (3.11+) and needs
# no packages beyond the standard library. This file only configures tests.
[project]
name = "falcon-node"
version = "2.0.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
